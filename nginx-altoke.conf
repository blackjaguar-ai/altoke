# Copiar a /opt/shared/web/sites/altoke.escai.tech.conf
#
# Elige UNA de las dos lineas de proxy_pass segun donde corra tu nginx:
#   nginx en el host   -> http://127.0.0.1:3011
#   nginx en Docker    -> http://altoke-app:3000   (requiere red externa `web`)
#
# Averigualo con:  docker ps --format '{{.Names}}  {{.Networks}}' | grep -i nginx

server {
    listen 80;
    server_name altoke.escai.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name altoke.escai.tech;

    ssl_certificate     /etc/letsencrypt/live/altoke.escai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altoke.escai.tech/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;

        # WebSocket: el socket del comprador va a realtime.useportal.co, no aqui,
        # pero dejamos el upgrade listo por si sirves algo propio despues.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
